# Déploiement VPS. Les images web/migrator sont construites par la CI (voir
# .github/workflows/cd.yml) et publiées sur GHCR — ce fichier ne construit rien lui-même.
# Variables attendues dans un fichier .env à côté de ce fichier (voir .env.production.example) :
#   IMAGE_REPO, IMAGE_TAG, POSTGRES_PASSWORD, DOMAIN
#
# Test local sans registre : remplacer temporairement `image:` par `build: { context: ., target: web }`
# (et `target: migrator` pour le service migrate), comme fait manuellement pendant le
# développement de cette configuration (voir docs/delivery.md).

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolyfoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD est obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:-evolyfoot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolyfoot} -d ${POSTGRES_DB:-evolyfoot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Aucun port publié : PostgreSQL n'est joignable que depuis les autres conteneurs de ce
    # réseau Docker, jamais publiquement (voir docs/delivery.md).

  migrate:
    image: ${IMAGE_REPO:?La variable IMAGE_REPO est obligatoire}/migrator:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evolyfoot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolyfoot}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${IMAGE_REPO:?La variable IMAGE_REPO est obligatoire}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evolyfoot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolyfoot}?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?La variable DOMAIN est obligatoire}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://evolyfoot:evolyfoot_ci@localhost:5432/evolyfoot_test?schema=public
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: evolyfoot
          POSTGRES_PASSWORD: evolyfoot_ci
          POSTGRES_DB: evolyfoot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evolyfoot -d evolyfoot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Activer pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Générer le client Prisma
        run: pnpm db:generate
      - name: Appliquer les migrations PostgreSQL
        run: pnpm db:migrate:deploy
      - name: Vérifier les types
        run: pnpm typecheck
      - name: Analyser le code
        run: pnpm lint
      - name: Exécuter les tests unitaires et d'intégration
        run: pnpm test
      - name: Construire les applications
        run: pnpm build

  e2e:
    name: Parcours end-to-end
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Activer pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exécuter le parcours critique
        run: pnpm exec playwright test --project=chromium
      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: Deploy iOS to TestFlight

# Construit EvolyFoot Coach et EvolyFoot Player pour iOS sur un runner macOS et envoie chaque build
# sur TestFlight (jamais l'App Store public), à chaque merge dans master qui touche le mobile ou
# ses dépendances partagées. Même méthode qu'arena-pulse (deploy-ios.yml) : signature manuelle
# avec le certificat de distribution du compte Apple, puis `xcodebuild -exportArchive` en
# `destination: upload` authentifié par une clé API App Store Connect — ni EAS, ni Fastlane.
#
# Le dossier ios/ n'est jamais commité : `expo prebuild` le régénère à chaque run depuis app.json.
#
# Vitesse (un build complet à froid dépasse 25 minutes) :
#   - le job `plan` ne retient que les applis concernées par le push (Coach : apps/mobile ;
#     Player : apps/mobile-player ; les deux : code partagé, lockfile, ce fichier). Un push qui ne
#     touche ni l'une ni l'autre ne lance aucun build macOS ;
#   - pas de file d'attente : plusieurs pushes de suite construisent en parallèle (le numéro de
#     build est le numéro de run, unique) au lieu de s'attendre ;
#   - la compilation des Pods (React Native, Expo, reanimated, screens, svg…) passe par ccache, mis
#     en cache entre les runs : seul ce qui change est recompilé.
#
# Inerte tant que les secrets ne sont pas configurés : le job s'arrête VERT avec un avertissement.
# Checklist unique (voir docs/delivery.md) :
#   1. developer.apple.com → Identifiers : App IDs com.evolyfoot.coach et com.evolyfoot.player,
#      capacité Push Notifications cochée.
#   2. Profiles : un profil « App Store Connect » par App ID, avec le certificat de distribution
#      existant du compte (le même que les autres applis).
#   3. App Store Connect → Apps → + : créer EvolyFoot Coach et EvolyFoot Player (mêmes bundle IDs).
# Secrets du dépôt (Settings → Secrets and variables → Actions) ; les 7 premiers reprennent les
# valeurs d'arena-pulse, même compte Apple :
#   IOS_DIST_CERTIFICATE_P12_BASE64        -- `base64 -i Distribution.p12`
#   IOS_DIST_CERTIFICATE_PASSWORD          -- mot de passe d'export du .p12
#   IOS_KEYCHAIN_PASSWORD                  -- quelconque, trousseau jetable de ce run
#   APPLE_TEAM_ID                          -- Team ID du compte Apple Developer
#   APP_STORE_CONNECT_KEY_ID               -- ID de la clé API App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID            -- Issuer ID de la clé API
#   APP_STORE_CONNECT_API_KEY_BASE64       -- `base64 -i AuthKey_<KEY_ID>.p8`
#   IOS_COACH_PROVISIONING_PROFILE_BASE64  -- `base64 -i EvolyFoot_Coach_AppStore.mobileprovision`
#   IOS_PLAYER_PROVISIONING_PROFILE_BASE64 -- `base64 -i EvolyFoot_Player_AppStore.mobileprovision`
on:
  push:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "apps/mobile-player/**"
      - "packages/domain/**"
      - "packages/design-tokens/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-ios.yml"
  workflow_dispatch:
    inputs:
      build_number:
        description: >-
          CFBundleVersion de cet envoi -- strictement supérieur au dernier build TestFlight de la
          version en cours. Par défaut, le numéro de run GitHub Actions.
        required: false
      apps:
        description: "Applis à construire : both (défaut), mobile (Coach) ou mobile-player (Player)."
        type: choice
        options: [both, mobile, mobile-player]
        default: both
      upload:
        description: "Envoyer sur TestFlight. Décoché : archive seule, pour mesurer ou tester ce workflow."
        type: boolean
        default: true

jobs:
  # Choisit les applis à construire d'après les fichiers du push. En cas de doute (comparaison
  # impossible), les deux sont construites : mieux vaut un build de trop qu'un build manquant.
  plan:
    name: Choisir les applis à construire
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - name: Comparer les fichiers modifiés
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          APPS_INPUT: ${{ inputs.apps }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          coach=false
          player=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "${APPS_INPUT:-both}" in
              mobile) coach=true ;;
              mobile-player) player=true ;;
              *)
                coach=true
                player=true
                ;;
            esac
          else
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --paginate --jq '.files[].filename' || true)
            if [ -z "$files" ]; then
              echo "::warning::Fichiers modifiés introuvables : les deux applis sont construites par précaution."
              coach=true
              player=true
            else
              while IFS= read -r file; do
                case "$file" in
                  # Les tests du domaine n'entrent pas dans les applications.
                  packages/domain/*.test.ts) ;;
                  apps/mobile/*) coach=true ;;
                  apps/mobile-player/*) player=true ;;
                  packages/domain/*|packages/design-tokens/*|pnpm-lock.yaml|.github/workflows/deploy-ios.yml)
                    coach=true
                    player=true
                    ;;
                esac
              done <<< "$files"
            fi
          fi

          any=false
          if [ "$coach" = true ] || [ "$player" = true ]; then
            any=true
          fi
          matrix=$(jq -cn --argjson coach "$coach" --argjson player "$player" '{include: (
            [ (if $coach then {app: "mobile", bundle_id: "com.evolyfoot.coach", profile_secret: "IOS_COACH_PROVISIONING_PROFILE_BASE64"} else empty end),
              (if $player then {app: "mobile-player", bundle_id: "com.evolyfoot.player", profile_secret: "IOS_PLAYER_PROVISIONING_PROFILE_BASE64"} else empty end) ]
            | if length == 0 then [{app: "aucune", bundle_id: "", profile_secret: ""}] else . end
          )}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "Coach : $coach -- Player : $player"

  ios:
    name: Archiver et envoyer sur TestFlight (${{ matrix.app }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      EXPO_PUBLIC_API_URL: https://evolyfoot.com
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Vérifier la présence des secrets Apple
        id: secrets-check
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets[matrix.profile_secret] }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EVENT: ${{ github.event_name }}
          UPLOAD_INPUT: ${{ inputs.upload }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$PROFILE_BASE64" ] || [ -z "$API_KEY_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Envoi TestFlight ignoré pour ${{ matrix.app }} : secrets Apple manquants. Voir l'en-tête de .github/workflows/deploy-ios.yml."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          # Lancement manuel avec « Envoyer sur TestFlight » décoché : on archive sans rien envoyer.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" = "false" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Archive seule : rien n'est envoyé sur TestFlight."
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le code
        if: steps.secrets-check.outputs.ready == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Installer Node.js
        if: steps.secrets-check.outputs.ready == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activer pnpm
        if: steps.secrets-check.outputs.ready == 'true'
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate

      - name: Installer les dépendances
        if: steps.secrets-check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # La compilation des Pods domine la durée du build : ccache la garde d'un run à l'autre.
      # React Native l'active tout seul quand USE_CCACHE=1 est posé au `pod install` ; la version de
      # Xcode est dans la clé de hachage, un changement d'image du runner n'utilise donc jamais
      # d'objets compilés par un autre compilateur.
      - name: Installer et configurer ccache
        if: steps.secrets-check.outputs.ready == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install ccache
          {
            echo "USE_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=string:$(xcodebuild -version | tr '\n' ' ')"
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,modules,pch_defines,system_headers,time_macros"
          } >> "$GITHUB_ENV"

      # Clé liée au lockfile : les Pods ne changent que quand les dépendances changent. Sans
      # correspondance exacte, le cache de la même appli le plus récent est repris puis complété.
      - name: Restaurer le cache de compilation
        if: steps.secrets-check.outputs.ready == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.ccache
          key: ccache-ios-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ccache-ios-${{ matrix.app }}-

      - name: Générer le projet iOS natif
        if: steps.secrets-check.outputs.ready == 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean --no-install
          # Le Podfile Expo lit aussi ce réglage : ccache pour les Pods (voir ci-dessus).
          node -e 'const fs=require("fs");const p="ios/Podfile.properties.json";const j=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):{};j["apple.ccacheEnabled"]="true";fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
          cd ios && pod install
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "INFO_PLIST=$PWD/$SCHEME/Info.plist" >> "$GITHUB_ENV"

      - name: Importer le certificat et le profil de provisioning
        if: steps.secrets-check.outputs.ready == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets[matrix.profile_secret] }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # Trousseau propre à ce run, jamais celui du runner ; la VM est détruite en fin de job.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)" >> "$GITHUB_ENV"

      # Signature manuelle sur la seule cible de l'appli : passée en ligne de commande à
      # xcodebuild, elle s'appliquerait aussi aux Pods, qui refusent un profil de provisioning.
      - name: Configurer la signature, la version et le numéro de build
        if: steps.secrets-check.outputs.ready == 'true'
        working-directory: apps/${{ matrix.app }}/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export MARKETING_VERSION=$(node -p "require('../app.json').expo.version")
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open(Dir["*.xcodeproj"].first)
            app = project.targets.find { |target| target.product_type == "com.apple.product-type.application" }
            app.build_configurations.each do |config|
              settings = config.build_settings
              settings["CODE_SIGN_STYLE"] = "Manual"
              settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              settings["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
              settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
              settings["MARKETING_VERSION"] = ENV["MARKETING_VERSION"]
              settings["CURRENT_PROJECT_VERSION"] = ENV["BUILD_NUMBER"]
            end
            project.save
          '
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST"
          # Conformité export (HTTPS standard) : déjà déclarée dans app.json, réaffirmée ici car
          # sans elle chaque build reste « Missing Compliance », invisible des testeurs.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" ||
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST"

      - name: Archiver
        if: steps.secrets-check.outputs.ready == 'true'
        working-directory: apps/${{ matrix.app }}/ios
        run: |
          set -euo pipefail
          ccache --zero-stats
          # COMPILER_INDEX_STORE_ENABLE=NO : pas d'index de code (utile à l'éditeur, pas au build).
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/archive.log" | head -50; tail -100 "$RUNNER_TEMP/archive.log"; ccache --show-stats || true; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
          # Taux de réussite du cache : le premier build d'une série est à froid, les suivants non.
          ccache --show-stats

      - name: Écrire ExportOptions.plist
        if: steps.secrets-check.outputs.ready == 'true' && steps.secrets-check.outputs.upload == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ matrix.bundle_id }}</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Exporter et envoyer sur TestFlight
        if: steps.secrets-check.outputs.ready == 'true' && steps.secrets-check.outputs.upload == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -uo pipefail
          mkdir -p ~/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_"$API_KEY_ID".p8

          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath ~/private_keys/AuthKey_"$API_KEY_ID".p8 \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          status="${PIPESTATUS[0]}"
          set -e

          if [ "$status" -ne 0 ]; then
            # Envoi déjà reçu par Apple lors d'un run interrompu puis relancé : le build est déjà
            # sur TestFlight, ce n'est pas un échec.
            if grep -q "Redundant Binary Upload\|code = 90189" "$RUNNER_TEMP/export.log"; then
              echo "::warning::Ce numéro de build est déjà sur TestFlight -- rien à renvoyer."
              exit 0
            fi
            exit "$status"
          fi

      - name: Nettoyer le trousseau et la clé API
        if: always() && steps.secrets-check.outputs.ready == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf ~/private_keys

name: CD

# Même modèle que le déploiement d'arena-pulse sur ce VPS partagé (voir docs/delivery.md) :
# SSH + `git pull` + `docker compose up -d --build` directement sur l'hôte, pas d'image
# pré-construite via registre. Bootstrap initial (clone du dépôt, réseau Docker partagé, .env)
# fait et premier déploiement manuel validé le 3 septembre 2026 (health check OK) -- voir
# docs/delivery.md. Se déclenche donc désormais sur chaque merge dans master, sans approbation
# manuelle (l'environnement GitHub `production` n'a aucune règle de protection configurée) :
# c'est la dernière étape (vérification de santé) qui protège contre un déploiement cassé,
# pas une revue humaine préalable.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Un seul déploiement à la fois : plusieurs merges rapprochés lançaient des builds simultanés sur
# le VPS, qui finissaient en timeout SSH ou de commande. Les suivants attendent leur tour.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Dépôt privé : le serveur récupère le code avec le jeton temporaire du workflow (lecture seule, expire
# à la fin du job, jamais écrit sur le serveur).
permissions:
  contents: read

jobs:
  deploy:
    name: Déployer sur le VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Récupérer le code et redémarrer la stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BILLING_ENFORCED: ${{ vars.BILLING_ENFORCED }}
          FETCH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Généreux plutôt que d'investiguer une cause réseau précise -- même rationale que
          # le déploiement d'arena-pulse sur ce même hôte.
          timeout: 90s
          # La limite par défaut de 10 minutes coupait le déploiement juste après le build.
          command_timeout: 25m
          # Paiement Stripe : secrets GitHub facultatifs, transmis à docker compose. Absents, on garde
          # les valeurs du .env du serveur (une variable vide exportée les masquerait).
          envs: STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,BILLING_ENFORCED,FETCH_TOKEN
          script: |
            set -euo pipefail
            for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET BILLING_ENFORCED; do
              if [ -z "${!name:-}" ]; then unset "$name"; fi
            done
            cd "${{ secrets.DEPLOY_PATH }}"
            auth="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch origin master
            unset auth FETCH_TOKEN
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f
      - name: Vérifier la santé du déploiement
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 30s
          # Le site peut mettre quelques secondes à répondre après le redémarrage des conteneurs.
          script: |
            for attempt in $(seq 1 24); do
              if curl -sf "https://${{ secrets.DEPLOY_DOMAIN }}/api/health/database" | grep -q '"status":"ok"'; then
                exit 0
              fi
              sleep 5
            done
            exit 1

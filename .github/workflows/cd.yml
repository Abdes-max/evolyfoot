name: CD

# Même modèle que le déploiement d'arena-pulse sur ce VPS partagé (voir docs/delivery.md) :
# SSH + `git pull` + `docker compose up -d --build` directement sur l'hôte, pas d'image
# pré-construite via registre. Déclenchement manuel tant que les secrets ci-dessous ne sont
# pas configurés et que le bootstrap initial (clone du dépôt, réseau Docker partagé, .env) n'a
# pas été fait sur le VPS -- voir docs/delivery.md. Une fois prêt, ajouter :
#   push:
#     branches: [master]
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Déployer sur le VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Récupérer le code et redémarrer la stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Généreux plutôt que d'investiguer une cause réseau précise -- même rationale que
          # le déploiement d'arena-pulse sur ce même hôte.
          timeout: 90s
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f
      - name: Vérifier la santé du déploiement
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 30s
          script: |
            curl -sf "https://${{ secrets.DEPLOY_DOMAIN }}/api/health/database" | grep -q '"status":"ok"'
